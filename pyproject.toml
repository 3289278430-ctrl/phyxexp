[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phyxexp"
version = "0.1.0"
description = "受约束的学生实验数据处理引擎与 Agent 工具链"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["phyxexp*"]

[tool.setuptools.package-data]
phyxexp = ["data/*.json"]
